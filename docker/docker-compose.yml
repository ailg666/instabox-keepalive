services:
  instabox-keepalive:
    # 镜像在 Docker Hub（CI 自动构建，amd64/arm64），up -d 自动拉取，无需 clone 无需 build；
    # 要本地构建改代码：docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    image: ailg/instabox-keepalive:latest
    container_name: instabox-keepalive
    restart: unless-stopped

    # init 负责回收 sleep 子进程、转发信号，docker stop 才干净
    init: true

    # key 只从 .env 读，不进命令行（docker ps 里看不到）
    env_file: .env

    environment:
      # 冷启动唤醒实测偶尔超过默认的 3×5s=15s 窗口，放大到 6×5s=30s。
      # 容器里没人盯着日志，宁可多等一会儿再判失败。
      INSTABOX_WAKE_TRIES: "6"
      # 容器是 read_only，防重标记（.snapshot-state）只能写 tmpfs 的 /tmp；
      # 写不进的话同一个小时里每轮 watch 都会重复做快照
      INSTABOX_SNAPSHOT_STATE: /tmp/instabox-snapshot-state

    # 脚本把失败标记写在 /tmp，其余只读即可
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
