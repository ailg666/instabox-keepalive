name = "instabox-keepalive"
main = "worker.js"
compatibility_date = "2026-10-16"

# 每 4 分钟续一次 5 分钟的租约；cron 最小粒度是 1 分钟
[triggers]
crons = ["*/4 * * * *"]

[vars]
# 非密钥的配置放这儿；INSTABOX_API_KEY 用 `npx wrangler secret put INSTABOX_API_KEY` 存
INSTABOX_MACHINE = "qqq"
INSTABOX_LEASE = "keepalive"
INSTABOX_LEASE_TTL = "300"
# TOKEN = "换成一串随机值，给手动触发用（不设则任何人有 URL 就能触发续租）"
