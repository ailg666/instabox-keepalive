name = "instabox-keepalive"
main = "worker.js"
compatibility_date = "2026-10-16"

# 每 9 分钟续一次 15 分钟的租约（cron 最小粒度 1 分钟）
# 注意 TTL 必须大于 cron 间隔，否则两次续租之间会空窗：间隔 9 分钟就填 900
[triggers]
crons = ["*/9 * * * *"]

[vars]
# 非密钥的配置；INSTABOX_API_KEY（以及多账号的 _2、_3 …）用 `npx wrangler secret put ...` 存
# INSTABOX_MACHINE 留空 = 保活该 key 名下所有机器
INSTABOX_MACHINE = ""
INSTABOX_LEASE = "keepalive"
INSTABOX_LEASE_TTL = "900"
# 写 KV 的频次，免费额度每天 1000 次写：hourly 每小时最多 1 条（~24/天）、every 每次都写、off 不写
INSTABOX_LOG_MODE = "hourly"
# 机器被挂起/停掉后续租会 409 machine_not_running：默认先 resume（stopped 用 start 兜底）再续租，设 0 关掉
INSTABOX_AUTO_RESUME = "1"
# 多账号：第 N 个账号 = 单账号变量名加 _N 后缀，加一个账号就多存一个 secret（别把 key 写进这个文件）：
#   npx wrangler secret put INSTABOX_API_KEY_2      # 2 号账号
#   npx wrangler secret put INSTABOX_API_KEY_3      # 3 号账号，依此类推
# 也可以在一个变量里塞多把：INSTABOX_API_KEY="ibk_aaa,ibk_bbb,ibk_ccc"（逗号分隔，
# 按顺序当 1、2、3 号账号）；两种写法混着用也行，显式 _N 的编号优先。
# 每个账号还可以用 INSTABOX_MACHINE_2 / INSTABOX_LEASE_2 / INSTABOX_LEASE_TTL_2 / INSTABOX_AUTO_RESUME_2
# 单独覆盖，不写就继承不带后缀的全局值（见 README《多个账号》）
# TOKEN = "换成一串随机值，所有请求都要带 ?token=..."

# 想看 /log 就绑一个 KV（dashboard: Storage & Databases → KV → 建一个 → 变量名填 LOG）
# [[kv_namespaces]]
# binding = "LOG"
# id = "<你的 KV namespace id>"
