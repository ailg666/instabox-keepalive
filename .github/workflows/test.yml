name: test

# 改了 keepalive.sh / worker.js / tools 就跑回归：全用假 key 打本地假 API，
# 不碰真账号、不发真请求（见 tools/mock_api.py）。
# main 上测试挂了会自动 git revert 触发它的那次提交（测试机器人自己 push 的
# revert 不会再次触发本工作流，天然无循环）。
on:
  push:
    branches: [main]
    paths:
      - keepalive.sh
      - worker/**
      - tools/**
      - .github/workflows/test.yml
  pull_request:
    paths:
      - keepalive.sh
      - worker/**
      - tools/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu：dash + bash，覆盖面最全
          - label: ubuntu
            container: ''
          # alpine：和 NAT 机器同款 busybox（sh/awk 都是 busybox 实现）
          - label: alpine-3.22
            container: alpine:3.22

    container: ${{ matrix.container }}

    steps:
      - name: 装依赖（alpine 容器）
        if: matrix.container != ''
        # tzdata：busybox date 要靠它才认得 TZ=Asia/Shanghai，否则静默回退 UTC，快照到点判断会错位
        # （本项目 Docker 镜像已自带 tzdata + TZ=Asia/Shanghai，见 docker/Dockerfile，生产不受影响）
        run: apk add --no-cache curl python3 nodejs tzdata

      - uses: actions/checkout@v4

      - name: 跑回归（${{ matrix.label }}）
        run: |
          sh tools/run_tests.sh all > /tmp/test.out 2>&1; rc=$?
          cat /tmp/test.out
          exit $rc

      - name: 失败摘要进 annotations（免登录也能从 API 读到挂点）
        if: failure()
        run: |
          sed 's/\x1b\[[0-9;]*m//g' /tmp/test.out | grep -E 'FAIL|期望包含|实际|错误' | head -12 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit 0

  revert:
    # 已禁用（if 恒 false）：个人仓库 CI 红了自动 git revert 太激进，曾把正常功能连环回退。
    # 要重新启用把下面的 if 改回 `failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'`
    needs: test
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 回退触发失败的那次提交
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git revert --no-edit '${{ github.sha }}'
          git push origin HEAD:refs/heads/main
          echo '::warning::测试未通过，已自动回退 ${{ github.sha }}'
